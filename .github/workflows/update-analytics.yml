name: Update Google Analytics Data

on:
  schedule:
    # Run every 6 hours
    - cron: '0 */6 * * *'
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write
  actions: write

jobs:
  update-analytics:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        
    - name: Install dependencies
      run: npm install @google-analytics/data
      
    - name: Fetch GA Data
      env:
        GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS }}
        GA_PROPERTY_ID: ${{ secrets.GA_PROPERTY_ID }}
      run: |
        # Create service account key file
        echo "$GOOGLE_APPLICATION_CREDENTIALS_JSON" > service-account.json
        
        # Create Node.js script to fetch data
        cat > fetch-ga-data.js << 'EOF'
        const { BetaAnalyticsDataClient } = require('@google-analytics/data');
        const fs = require('fs');
        
        const analyticsDataClient = new BetaAnalyticsDataClient({
          keyFilename: './service-account.json'
        });
        
        const propertyId = process.env.GA_PROPERTY_ID;
        
        async function fetchGAData() {
          try {
            // Fetch total page views
            const [visitorResponse] = await analyticsDataClient.runReport({
              property: `properties/${propertyId}`,
              dateRanges: [
                {
                  startDate: '2026-03-01', // Since March 2026
                  endDate: 'today'
                }
              ],
              metrics: [
                { name: 'screenPageViews' }
              ]
            });
            
            const totalPageViews = visitorResponse.rows?.[0]?.metricValues?.[0]?.value || 0;
            
            // Fetch geo data (country breakdown by page views)
            const [geoResponse] = await analyticsDataClient.runReport({
              property: `properties/${propertyId}`,
              dateRanges: [
                {
                  startDate: '2026-03-01',
                  endDate: 'today'
                }
              ],
              dimensions: [
                { name: 'country' }
              ],
              metrics: [
                { name: 'screenPageViews' }
              ],
              orderBys: [
                {
                  metric: { metricName: 'screenPageViews' },
                  desc: true
                }
              ],
              limit: 20
            });
            
            const geoData = geoResponse.rows?.map(row => ({
              country: row.dimensionValues[0].value,
              visitors: parseInt(row.metricValues[0].value)
            })) || [];
            
            // Write to JSON file
            const analyticsData = {
              totalPageViews: parseInt(totalPageViews),
              lastUpdated: new Date().toISOString().split('T')[0],
              geoData: geoData
            };
            
            fs.writeFileSync(
              './assets/json/analytics.json',
              JSON.stringify(analyticsData, null, 2)
            );
            
            console.log('Analytics data updated successfully');
            console.log(`Total page views: ${totalPageViews}`);
            console.log(`Geo data points: ${geoData.length}`);
            
          } catch (error) {
            console.error('Error fetching GA data:', error);
            process.exit(1);
          }
        }
        
        fetchGAData();
        EOF
        
        node fetch-ga-data.js
        
    - name: Check for changes
      id: check_changes
      run: |
        if git diff --quiet assets/json/analytics.json; then
          echo "has_changes=false" >> $GITHUB_OUTPUT
        else
          echo "has_changes=true" >> $GITHUB_OUTPUT
        fi
        
    - name: Commit and push changes
      if: steps.check_changes.outputs.has_changes == 'true'
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "GitHub Actions"
        git add assets/json/analytics.json
        git commit -m "Update Google Analytics data"
        git push
        
    - name: Trigger Pages deploy
      if: steps.check_changes.outputs.has_changes == 'true'
      uses: actions/github-script@v7
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        script: |
          await github.rest.actions.createWorkflowDispatch({
            owner: context.repo.owner,
            repo: context.repo.repo,
            workflow_id: 'deploy.yml',
            ref: 'main'
          });
          console.log('Triggered deploy.yml workflow');
